[package]
name = "ccp-kernel"
version = "0.5.0"
edition = "2021"
description = "Portable CCP kernel: canonical JSON, Ed25519, schema subset, decision, state machine"
readme = "README.md"
keywords = ["capability", "security", "protocol", "ed25519"]
categories = ["cryptography", "authentication"]
license = "Apache-2.0"

[lib]
name = "ccp_kernel"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "3"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
regex = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[profile.release]
panic = "abort"
